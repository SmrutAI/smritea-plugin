# Pre-commit hooks for smritea-plugin
#
# Setup:
#   pip install pre-commit && pre-commit install
#
# Usage:
#   pre-commit run --all-files   # Run all hooks
#   pre-commit run <hook-id>     # Run a specific hook
#
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: plugin-check
        name: Syntax check (node --check)
        entry: make check
        language: system
        files: ^scripts/.*\.js$
        pass_filenames: false

      - id: plugin-build
        name: Bundle (esbuild) — rebuilds scripts/dist/context-hook.js
        entry: make build
        language: system
        files: ^scripts/.*\.js$
        pass_filenames: false

      - id: plugin-lint
        name: Lint (eslint)
        entry: make lint
        language: system
        files: ^scripts/.*\.js$
        pass_filenames: false

      # always_run: the committed scripts/dist bundle inlines smritea-mcp dist
      # code, so it can go stale from changes OUTSIDE this repo — a files:
      # pattern on plugin sources can never catch that. The smoke fails until
      # the regenerated bundle is staged, forcing freshness on every commit.
      - id: plugin-smoke
        name: Publish smoke (bundle freshness + staged hook run + .mcp.json)
        entry: make smoke
        language: system
        always_run: true
        pass_filenames: false
